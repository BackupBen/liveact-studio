name: Build Webapp Image

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/docker-webapp.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./webapp
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/liveact-studio-webapp:latest
            ghcr.io/${{ github.repository_owner }}/liveact-studio-webapp:${{ github.sha }}
