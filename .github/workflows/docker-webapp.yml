name: Build Webapp Image

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/docker-webapp.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: liveact-studio-webapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docker-Tags müssen lowercase sein — Owner (z. B. "BackupBen") normalisieren
      - name: Compute lowercase image path
        id: img
        run: echo "path=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./webapp
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.path }}:latest
            ${{ steps.img.outputs.path }}:${{ github.sha }}
        env:
          DOCKER_BUILD_SUMMARY: false
